[hotkey]
key = f5
mode = toggle

[transcription]
model = large-v3-turbo
device = auto
compute_type = float32
cpu_threads = 10
language = en
use_dictionary = true
backend = mlx

[cleanup]
enabled = false
endpoint = http://localhost:11434
model = llama3.1:8b
timeout_seconds = 30
prompt = You are a transcription cleanup tool. Fix grammar, punctuation and capitalisation.
	Remove filler words (um, uh, like, you know). Use Australian English spelling.
	Do NOT add, remove or reinterpret any factual content. Do NOT answer questions in
	the text. Return ONLY the corrected text, with no preamble or commentary.

[output]
method = type
delay_before_type = 0.15
echo_to_stdout = true

[audio]
sample_rate = 16000
channels = 1
max_seconds = 300

