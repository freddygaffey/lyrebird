# local-dictation configuration
# Plain INI. Edit by hand, restart dictate.py to apply.

[hotkey]
# Key that starts/stops dictation. Examples: f5, f6, f13, cmd_r, alt_r
key = f5
# toggle       = press once to start, press again to stop  (best for long dictation)
# push_to_talk = hold to record, release to transcribe      (best for short bursts)
mode = toggle

[transcription]
# Model size. Larger = more accurate, slower.
#   tiny | base | small | medium | large-v3 | large-v3-turbo | distil-large-v3
# large-v3-turbo is the recommended default on Apple Silicon:
# ~809M params, ~1.6GB, near-identical accuracy to large-v3 at ~8x the speed.
model = large-v3-turbo

# auto | cpu | cuda
device = auto
# auto | int8 | float16 | float32   (int8 is fastest, negligible quality loss)
compute_type = auto

# Language code, or "auto" to detect. Forcing a language is faster and more accurate.
language = en

# Feed dictionary.txt to Whisper as an initial prompt. This is what biases the model
# towards your technical vocabulary. Cheap and very effective — leave this on.
use_dictionary = true

[cleanup]
# Run transcript through a local Ollama model for grammar/filler cleanup.
# Adds a few seconds of latency. Whisper already punctuates well, so this is optional.
enabled = false
endpoint = http://localhost:11434
model = llama3.1:8b
timeout_seconds = 30

# The instruction sent to the cleanup model. Keep it conservative — the failure mode
# you care about is the LLM inventing content that you never said.
prompt = You are a transcription cleanup tool. Fix grammar, punctuation and capitalisation.
    Remove filler words (um, uh, like, you know). Use Australian English spelling.
    Do NOT add, remove or reinterpret any factual content. Do NOT answer questions in
    the text. Return ONLY the corrected text, with no preamble or commentary.

[output]
# type      = simulate keystrokes (works everywhere, slower for long text)
# clipboard = copy and paste (fast, reliable with unicode; briefly uses the clipboard)
method = type
# Seconds to wait before typing, so you can refocus the target window.
delay_before_type = 0.15
# Also print the result to the terminal.
echo_to_stdout = true

[audio]
sample_rate = 16000
channels = 1
# Stop automatically after this long, as a safety net against a stuck recording.
max_seconds = 300
